<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리처드 사퍼 릴스 A/B 비교</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
*{box-sizing:border-box}body{margin:0;background:#101010;color:#fff;font-family:Pretendard,sans-serif}.wrap{max-width:1180px;margin:auto;padding:36px 20px 80px}h1{font-size:30px;letter-spacing:-.07em;margin:0 0 8px}p{margin:0 0 30px;color:#a5a5a5;font-size:14px}.labels,.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}.labels{position:sticky;top:0;z-index:2;background:#101010;padding:14px 0 10px}.labels strong{font-size:16px}.labels span{display:block;margin-top:3px;color:#aaa;font-size:12px}.pair{margin-bottom:18px}.pair>div{background:#191919;padding:8px}.pair small{display:block;margin:2px 0 7px;color:#a7a7a7;font-size:11px}iframe{display:block;width:100%;aspect-ratio:9/16;border:0;background:#000}@media(max-width:640px){.wrap{padding:24px 10px 44px}.labels,.pair{gap:8px}.pair>div{padding:4px}h1{font-size:25px}.labels strong{font-size:13px}}
</style></head><body><main class="wrap"><h1>리처드 사퍼 릴스 A/B 비교</h1><p>각 행은 같은 장면입니다. 왼쪽은 차분한 A안, 오른쪽은 훅을 강화한 B안입니다.</p><div class="labels"><div><strong>A — 디자인은 왜 / 조용해야 할까?</strong><span>철학 중심</span></div><div><strong>B — 좋은 디자인은 / 왜 말을 아낄까?</strong><span>질문 중심 · 확정안</span></div></div>
<section id="pairs"></section></main><script>const root=document.querySelector('#pairs');for(let i=1;i<=6;i++){const row=document.createElement('div');row.className='pair';row.innerHTML=`<div><small>${String(i).padStart(2,'0')} · A</small><iframe title="A안 ${i}장" src="./variant-a/?card=${i}"></iframe></div><div><small>${String(i).padStart(2,'0')} · B</small><iframe title="B안 ${i}장" src="./?card=${i}"></iframe></div>`;root.append(row)}</script></body></html>
